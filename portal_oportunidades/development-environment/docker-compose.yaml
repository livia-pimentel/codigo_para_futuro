# Configuração usando docker
version: "3"

services:
  # Configuração do banco usando postgres
  postgres:
    container_name: portal_oportunidades
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=portal_oportunidades
    networks:
      - dev

networks:
  dev:

volumes:
  pgdata: